# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow lets you generate SLSA provenance file for your project.
# The generation satisfies level 3 for the provenance requirements - see https://slsa.dev/spec/v0.1/requirements
# The project is an initiative of the OpenSSF (openssf.org) and it is developed at
# https://github.com/slsa-framework/slsa-github-generator.
# The provenance file can be verified using https://github.com/slsa-framework/slsa-verifier.
# For more information on SLSA and how it improves the supply-chain, visit slsa.dev.

name: SLSA generic generator
on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - uses: actions/checkout@v4
      # The packager needs Python 3.11 or newer, for tomllib.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ========================================================
      #
      # Step 1: Build the artifact.
      #
      # The artifact is the mod itself: the `.hnmod` the launcher takes. The
      # packager writes the same bytes every time, so this is the file the
      # release carries.
      - name: Build the package
        id: build
        run: |
          set -euo pipefail
          python3 worldedit-horizon/tools/package.py
          cd worldedit-horizon/target
          pkg=$(ls *.hnmod)
          echo "name=$pkg" >> "$GITHUB_OUTPUT"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: worldedit-horizon/target/${{ steps.build.outputs.name }}
          if-no-files-found: error

      # ========================================================
      #
      # Step 2: Add a step to generate the provenance subjects
      #         as shown below. Update the sha256 sum arguments
      #         to include all binaries that you generate
      #         provenance for.
      #
      # ========================================================
      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail

          # List the artifacts the provenance will refer to.
          cd worldedit-horizon/target
          files=$(ls *.hnmod)
          # Generate the subjects (base64 encoded). The name of the output is
          # the one the job hands to the generator: `digests`.
          echo "digests=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: [build]
    permissions:
      actions: read   # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true # Optional: Upload to a new release
