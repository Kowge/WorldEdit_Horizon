name: Pinned native build

# The bundle is compiled into the game of the commit it pins, with the
# mixins it pins, and the rules of the mod are tested on their own. This is
# the evidence a reviewer asks for: the registry's own check does not
# execute a native mod, and the compatibility run builds on the newest
# Nightly, not on the pin.
on:
  push:
    branches: [ "main" ]
    tags: [ "worldedit_horizon-*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The commit the bundle is built and tested against: the one
  # worldedit-horizon/compatibility.json pins.
  HORIZON_REV: 66f3981f522b24c250b21523a70080965b940424

jobs:
  pinned:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: The toolchain the mixins need
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - name: The libraries the game needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: The rules of the mod on their own
        run: |
          set -o pipefail
          cargo test --verbose --manifest-path worldedit-horizon/core-test/Cargo.toml 2>&1 | tee core-test.log

      # The source of the pinned commit, the way the registry's own tool
      # takes it: the archive of the commit, never a checkout.
      - name: The source of the pinned commit
        run: |
          set -euo pipefail
          mkdir -p pinned/source
          curl -sSL --retry 3 -o pinned/horizon.tar.gz \
            "https://codeload.github.com/horizon-rust/horizon/tar.gz/$HORIZON_REV"
          tar -xzf pinned/horizon.tar.gz -C pinned/source --strip-components=1
          # The source has a few links (the docs), and the mixins tool takes
          # none: the registry's own tool removes them the same way.
          find pinned/source -type l -delete

      # The mixins of the revision the bundle pins.
      - name: The mixins of the pinned revision
        run: |
          set -euo pipefail
          rev=$(python3 -c "import json;print(json.load(open('worldedit-horizon/compatibility.json'))['horizon_mixins_revision'])")
          echo "MIXINS_REV=$rev" >> "$GITHUB_ENV"
          cargo install --locked --quiet \
            --git https://github.com/horizon-rust/horizon-mixins --rev "$rev" \
            --root pinned/tool horizon-mixins-cli

      # The bundle applied to that source, as the launcher applies it.
      - name: The bundle applied to that source
        run: |
          set -euo pipefail
          mkdir -p pinned/mods/worldedit_horizon
          cp -r worldedit-horizon/mixins/worldedit_horizon/. pinned/mods/worldedit_horizon/
          pinned/tool/bin/horizon-mixins apply \
            --workspace pinned/source --mods pinned/mods --out pinned/stage

      # The game, built with the bundle: the same build the launcher makes.
      - name: The game built with the bundle
        run: |
          set -o pipefail
          cd pinned/stage
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/pinned/target" \
            cargo build --locked -p horizon-client --bin horizon-client --profile fast 2>&1 | tee "$GITHUB_WORKSPACE/native-build.log"

      - name: What was built
        run: |
          {
            echo "## The pinned native build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Horizon | \`$HORIZON_REV\` |"
            echo "| Mixins | \`$MIXINS_REV\` |"
            echo "| Hooks | \`$(python3 -c "import json;print(json.load(open('worldedit-horizon/compatibility.json'))['hooks'])")\` |"
            echo "| Game | \`$(python3 -c "import json;print(json.load(open('worldedit-horizon/compatibility.json'))['game'])")\` |"
            echo
            echo "The bundle of this commit was applied to the game of that exact Horizon commit, with the"
            echo "mixins of that exact revision, and the game was built with it — the same build the launcher"
            echo "makes for a player."
            echo
            echo "### The tests of the rules"
            echo
            echo '```'
            tail -n 30 core-test.log
            echo '```'
            echo
            echo "### The build"
            echo
            echo '```'
            tail -n 20 native-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: pinned-native-logs
          path: |
            core-test.log
            native-build.log
          if-no-files-found: error
