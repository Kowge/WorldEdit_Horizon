[mod]
id = "worldedit_horizon"
version = "1.0.0"
priority = 100

# The commit of horizon main it was tested on. It uses only the native hook
# points (hooks 58 in compatibility.json): it builds on any Horizon that has them.
[compatibility]
horizon_revision = "68ff4699847c591d3cb81f0af6b131a7e2239f3f"

[[module]]
id = "core"
file = "crates/horizon-client/src/game.rs"
name = "we_core"
source = "we_core.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "we_glue"
source = "glue.rs"

# The client's half: the selection as it is drawn, without the game types.
[[module]]
id = "geometry"
file = "crates/horizon-client/src/game.rs"
name = "we_geometry"
source = "geometry.rs"

# The client's half: the selection the server sent and the lines it is drawn
# with.
[[module]]
id = "render"
file = "crates/horizon-client/src/game.rs"
name = "we_render"
source = "render.rs"

[[injection]]
id = "register"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_register_commands"
helper = "register.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<crate::game::native_server::NativeCommand>", value = "&mut *commands" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_perform_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&crate::game::native_server::NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "destroy_block"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_destroy_block"
helper = "destroy_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "right_click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_right_click_block"
helper = "right_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "lifecycle"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_world_lifecycle"
helper = "lifecycle.rs"
bindings = [
  { name = "phase", ty = "crate::game::native_lifecycle::WorldPhase", value = "phase" },
]

# The client's half: the selection the server sent.
[[injection]]
id = "selection"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_net_from_server"
helper = "net_helper.rs"
bindings = [
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

# The wand's click, which a dedicated server only hears from the client.
[[injection]]
id = "wand"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_net_from_client"
helper = "net_client_helper.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

# The lines of the selection, over everything: the blocks do not hide them.
[[injection]]
id = "selection-on-top"
kind = "HEAD"
target = "horizon_client::game::debug_renderers::Game<'_>::debug_renderer_gizmos"
helper = "gizmo_helper.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "gizmos", ty = "&mut crate::gizmos::Gizmos", value = "&mut *g" },
]
