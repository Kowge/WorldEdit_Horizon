[mod]
id = "worldedit_horizon"
version = "1.5.1"
priority = 100

# The commit of horizon main it was tested on. It uses only the native hook
# points (hooks 58 in compatibility.json): it builds on any Horizon that has them.
[compatibility]
horizon_revision = "66f3981f522b24c250b21523a70080965b940424"

[[module]]
id = "core"
file = "crates/horizon-client/src/game.rs"
name = "we_core"
source = "we_core.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "we_glue"
source = "glue.rs"

# The client's half: the selection as it is drawn, without the game types.
[[module]]
id = "geometry"
file = "crates/horizon-client/src/game.rs"
name = "we_geometry"
source = "geometry.rs"

# The client's half: the brush's clicks in the air.
[[module]]
id = "brush_client"
file = "crates/horizon-client/src/game.rs"
name = "we_brush_client"
source = "brush_client.rs"

# The client's half: the selection the server sent and the lines it is drawn
# with.
[[module]]
id = "render"
file = "crates/horizon-client/src/game.rs"
name = "we_render"
source = "render.rs"

# The client's half: the mod's row in Options > Mods and the button that
# opens the folder with the schematics.
[[module]]
id = "mods_ui"
file = "crates/horizon-client/src/game.rs"
name = "we_mods_ui"
source = "mods_ui.rs"

# The client's half: the schematics are the player's own files, so the
# client keeps them.
[[module]]
id = "schematics_client"
file = "crates/horizon-client/src/game.rs"
name = "we_schematics_client"
source = "schematics_client.rs"

[[injection]]
id = "register"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_register_commands"
helper = "register.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<crate::game::native_server::NativeCommand>", value = "&mut *commands" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_perform_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&crate::game::native_server::NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "destroy_block"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_destroy_block"
helper = "destroy_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "right_click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_right_click_block"
helper = "right_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# The wand's right click in the air: the brush erases along the line of sight.
[[injection]]
id = "use_item"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_use_item"
helper = "use_item.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

# The left mouse button: the click in the air, where there is no block.
[[injection]]
id = "mouse"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mouse_button_pre"
helper = "mouse_helper.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "button", ty = "i32", value = "button" },
  { name = "pressed", ty = "bool", value = "pressed" },
  { name = "_modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "lifecycle"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_world_lifecycle"
helper = "lifecycle.rs"
bindings = [
  { name = "phase", ty = "crate::game::native_lifecycle::WorldPhase", value = "phase" },
]

# The client's half: the selection the server sent.
[[injection]]
id = "selection"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_net_from_server"
helper = "net_helper.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

# The wand's click, which a dedicated server only hears from the client.
[[injection]]
id = "wand"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_net_from_client"
helper = "net_client_helper.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

# The lines of the selection, over everything: the blocks do not hide them.
[[injection]]
id = "selection-on-top"
kind = "HEAD"
target = "horizon_client::game::debug_renderers::Game<'_>::debug_renderer_gizmos"
helper = "gizmo_helper.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "gizmos", ty = "&mut crate::gizmos::Gizmos", value = "&mut *g" },
]

# Options > Mods lists the native mods: the mod's own row.
[[injection]]
id = "mods"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "mods_helper.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::mod_api::NativeMod>", value = "&mut *mods" },
]

# The buttons of the mod's page in Options > Mods.
[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings_helper.rs"
bindings = [
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

# A button of the mod's page was pressed: the folder with the schematics.
[[injection]]
id = "settings_click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "settings_click_helper.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
